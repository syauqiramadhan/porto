<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak — Chat App</title>
    <link rel="icon" href="../../images/sr_logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: #0ea5e9;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .2s
        }

        .back-btn:hover {
            background: #0284c7
        }

        .topbar {
            background: #1e293b;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155
        }

        .topbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0ea5e9
        }

        .topbar-brand span {
            color: #e2e8f0
        }

        .topbar-nav {
            display: flex;
            gap: 8px
        }

        .topbar-nav a {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            color: #94a3b8;
            background: #0f172a;
            transition: all .2s
        }

        .topbar-nav a:hover,
        .topbar-nav a.active {
            background: #0ea5e9;
            color: #fff
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px
        }

        .page-sub {
            color: #94a3b8;
            margin-bottom: 24px
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #e2e8f0;
            font-size: .85rem;
            outline: none;
            margin-bottom: 20px
        }

        .search-box:focus {
            border-color: #0ea5e9
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: #1e293b;
            border-radius: 12px;
            cursor: pointer;
            transition: all .2s;
            border: 1px solid transparent
        }

        .contact-card:hover {
            border-color: #0ea5e9;
            transform: translateX(4px)
        }

        .contact-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0
        }

        .contact-info {
            flex: 1
        }

        .contact-name {
            font-weight: 600;
            font-size: .9rem
        }

        .contact-status {
            font-size: .75rem;
            color: #94a3b8
        }

        .contact-actions {
            display: flex;
            gap: 8px
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #0f172a;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s
        }

        .action-btn:hover {
            background: #0ea5e9;
            color: #fff
        }

        .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: .85rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all .3s;
            z-index: 200;
            border: 1px solid #334155
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0)
        }

        .demo-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeOverlay .4s .2s ease forwards
        }

        .demo-popup {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 20px;
            padding: 36px 40px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            color: #fff;
            transform: scale(.85);
            opacity: 0;
            animation: popIn .5s .4s cubic-bezier(.34, 1.56, .64, 1) forwards;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .4)
        }

        .demo-popup .popup-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
            animation: bounce 2s ease infinite
        }

        .demo-popup h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .demo-popup p {
            font-size: .88rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px
        }

        .demo-popup .popup-btn {
            padding: 10px 32px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: .88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 15px rgba(14, 165, 233, .4)
        }

        .demo-popup .popup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, .5)
        }

        @keyframes fadeOverlay {
            to {
                opacity: 1
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
                opacity: 1
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }
        }

        @media(max-width:768px) {
            .topbar {
                flex-wrap: wrap;
                gap: 8px
            }

            .topbar-nav {
                flex-wrap: wrap
            }
        }
    </style>
</head>

<body>
    <div class="demo-overlay" id="demoOverlay" onclick="closeDemoPopup()">
        <div class="demo-popup" onclick="event.stopPropagation()"><span class="popup-icon">💬</span>
            <h3>Halaman Demo</h3>
            <p>Ini adalah halaman <strong style="color:#e2e8f0">demo</strong> dari aplikasi yang pernah dibuat. Silakan
                klik-klik dan coba fitur yang tersedia!</p><button class="popup-btn"
                onclick="closeDemoPopup()">Mengerti, Lanjutkan →</button>
        </div>
    </div>
    <script>function closeDemoPopup() { const o = document.getElementById('demoOverlay'); o.style.opacity = '0'; setTimeout(() => o.remove(), 400); }</script>
    <a href="../../index.html#projects" class="back-btn">← Kembali</a>
    <header class="topbar">
        <div class="topbar-brand">💬 <span>Chat</span>App</div>
        <nav class="topbar-nav"><a href="index.html">💬 Chat</a><a href="kontak.html" class="active">👥 Kontak</a><a
                href="pengaturan.html">⚙️ Pengaturan</a></nav>
    </header>
    <div class="container">
        <h1 class="page-title">Daftar Kontak</h1>
        <p class="page-sub">Kelola kontak dan teman Anda</p>
        <input type="text" class="search-box" placeholder="🔍 Cari kontak..." id="searchBox" />
        <div class="contact-list" id="contactList"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const contacts = [
            { name: 'Ahmad Fauzi', status: 'online', color: '#10b981', lastSeen: 'Aktif sekarang', phone: '0812-xxxx-1234' },
            { name: 'Siti Nurhaliza', status: 'online', color: '#0ea5e9', lastSeen: 'Aktif sekarang', phone: '0813-xxxx-5678' },
            { name: 'Budi Santoso', status: 'offline', color: '#f59e0b', lastSeen: 'Terakhir 2 jam lalu', phone: '0857-xxxx-9012' },
            { name: 'Dewi Lestari', status: 'online', color: '#8b5cf6', lastSeen: 'Aktif sekarang', phone: '0878-xxxx-3456' },
            { name: 'Rizky Ramadhan', status: 'offline', color: '#ef4444', lastSeen: 'Terakhir kemarin', phone: '0821-xxxx-7890' },
            { name: 'Putri Amelia', status: 'online', color: '#ec4899', lastSeen: 'Aktif sekarang', phone: '0811-xxxx-2345' },
            { name: 'Hendra Wijaya', status: 'offline', color: '#6366f1', lastSeen: 'Terakhir 5 jam lalu', phone: '0856-xxxx-6789' },
            { name: 'Maya Sari', status: 'online', color: '#14b8a6', lastSeen: 'Aktif sekarang', phone: '0899-xxxx-0123' },
            { name: 'Dimas Pratama', status: 'offline', color: '#f97316', lastSeen: 'Terakhir 1 jam lalu', phone: '0822-xxxx-4567' },
            { name: 'Lina Marlina', status: 'offline', color: '#a855f7', lastSeen: 'Terakhir 3 hari lalu', phone: '0833-xxxx-8901' },
        ];
        function render(data) {
            document.getElementById('contactList').innerHTML = (data || contacts).map(c => `
                <div class="contact-card" onclick="showToast('Chat dengan ${c.name}')">
                    <div class="contact-avatar" style="background:${c.color}">${c.name.charAt(0)}</div>
                    <div class="contact-info">
                        <div class="contact-name"><span class="online-dot" style="background:${c.status === 'online' ? '#10b981' : '#64748b'}"></span>${c.name}</div>
                        <div class="contact-status">${c.lastSeen} · ${c.phone}</div>
                    </div>
                    <div class="contact-actions">
                        <button class="action-btn" onclick="event.stopPropagation();showToast('📞 Menelepon ${c.name}...')">📞</button>
                        <button class="action-btn" onclick="event.stopPropagation();showToast('📹 Video call ${c.name}...')">📹</button>
                    </div>
                </div>
            `).join('');
        }
        render();
        document.getElementById('searchBox').addEventListener('input', function () { const q = this.value.toLowerCase(); render(contacts.filter(c => c.name.toLowerCase().includes(q))); });
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    </script>
</body>

</html>
