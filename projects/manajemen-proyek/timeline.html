<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeline — Manajemen Proyek</title>
    <link rel="icon" href="../../images/sr_logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fffbeb;
            color: #1e293b;
            min-height: 100vh
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: #f59e0b;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .2s
        }

        .back-btn:hover {
            background: #d97706
        }

        .topbar {
            background: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 50
        }

        .topbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f59e0b
        }

        .topbar-brand span {
            color: #1e293b
        }

        .topbar-nav {
            display: flex;
            gap: 8px
        }

        .topbar-nav a {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            color: #64748b;
            background: #f8fafc;
            transition: all .2s
        }

        .topbar-nav a:hover,
        .topbar-nav a.active {
            background: #f59e0b;
            color: #fff
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px 24px
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px
        }

        .page-sub {
            color: #64748b;
            margin-bottom: 24px
        }

        .timeline {
            position: relative;
            padding-left: 40px
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 16px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #f59e0b, #fbbf24, #d97706);
            border-radius: 3px
        }

        .timeline-item {
            position: relative;
            margin-bottom: 24px;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            border-left: 4px solid transparent;
            transition: all .2s
        }

        .timeline-item:hover {
            transform: translateX(4px)
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -32px;
            top: 24px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #f59e0b;
            background: #fff
        }

        .timeline-item.done {
            border-left-color: #10b981;
            opacity: .7
        }

        .timeline-item.done::before {
            background: #10b981;
            border-color: #10b981
        }

        .timeline-item.active {
            border-left-color: #f59e0b
        }

        .timeline-item.active::before {
            background: #f59e0b;
            border-color: #f59e0b
        }

        .timeline-item.upcoming {
            border-left-color: #94a3b8
        }

        .timeline-item.upcoming::before {
            background: #fff;
            border-color: #94a3b8
        }

        .ti-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px
        }

        .ti-title {
            font-weight: 600;
            font-size: .95rem
        }

        .ti-date {
            font-size: .75rem;
            color: #94a3b8
        }

        .ti-desc {
            font-size: .82rem;
            color: #64748b;
            margin-bottom: 8px
        }

        .ti-progress {
            height: 6px;
            background: #f1f5f9;
            border-radius: 3px;
            overflow: hidden
        }

        .ti-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .6s
        }

        .ti-members {
            display: flex;
            gap: -8px;
            margin-top: 8px
        }

        .ti-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .65rem;
            font-weight: 700;
            color: #fff;
            border: 2px solid #fff;
            margin-left: -6px
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: .65rem;
            font-weight: 600
        }

        .badge-green {
            background: #d1fae5;
            color: #065f46
        }

        .badge-yellow {
            background: #fef3c7;
            color: #92400e
        }

        .badge-gray {
            background: #f1f5f9;
            color: #64748b
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: .85rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all .3s;
            z-index: 200
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0)
        }

        .demo-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeOverlay .4s .2s ease forwards
        }

        .demo-popup {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 20px;
            padding: 36px 40px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            color: #fff;
            transform: scale(.85);
            opacity: 0;
            animation: popIn .5s .4s cubic-bezier(.34, 1.56, .64, 1) forwards;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .4)
        }

        .demo-popup .popup-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
            animation: bounce 2s ease infinite
        }

        .demo-popup h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .demo-popup p {
            font-size: .88rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px
        }

        .demo-popup .popup-btn {
            padding: 10px 32px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: .88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, .4)
        }

        .demo-popup .popup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, .5)
        }

        @keyframes fadeOverlay {
            to {
                opacity: 1
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
                opacity: 1
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }
        }

        @media(max-width:768px) {
            .topbar {
                flex-wrap: wrap;
                gap: 8px
            }

            .topbar-nav {
                flex-wrap: wrap
            }
        }
    </style>
</head>

<body>
    <div class="demo-overlay" id="demoOverlay" onclick="closeDemoPopup()">
        <div class="demo-popup" onclick="event.stopPropagation()"><span class="popup-icon">📋</span>
            <h3>Halaman Demo</h3>
            <p>Ini adalah halaman <strong style="color:#e2e8f0">demo</strong> dari aplikasi yang pernah dibuat. Silakan
                klik-klik dan coba fitur yang tersedia!</p><button class="popup-btn"
                onclick="closeDemoPopup()">Mengerti, Lanjutkan →</button>
        </div>
    </div>
    <script>function closeDemoPopup() { const o = document.getElementById('demoOverlay'); o.style.opacity = '0'; setTimeout(() => o.remove(), 400); }</script>
    <a href="../../index.html#projects" class="back-btn">← Kembali</a>
    <header class="topbar">
        <div class="topbar-brand">📋 <span>Proyek</span>Manager</div>
        <nav class="topbar-nav"><a href="index.html">📋 Board</a><a href="timeline.html" class="active">📅
                Timeline</a><a href="laporan.html">📊 Laporan</a><a href="tim.html">👥 Tim</a></nav>
    </header>
    <div class="container">
        <h1 class="page-title">Timeline Proyek</h1>
        <p class="page-sub">Website E-Commerce Redesign — Sprint 4</p>
        <div class="timeline" id="timeline"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const milestones = [
            { title: 'Riset & Analisis', desc: 'Analisis kebutuhan dan riset kompetitor', date: '1-7 Jan 2026', progress: 100, status: 'done', colors: ['#10b981', '#ef4444'] },
            { title: 'Wireframing UI/UX', desc: 'Desain wireframe low-fidelity & high-fidelity', date: '8-14 Jan 2026', progress: 100, status: 'done', colors: ['#f59e0b', '#8b5cf6'] },
            { title: 'Desain Visual', desc: 'Pembuatan mockup dan design system', date: '15-28 Jan 2026', progress: 100, status: 'done', colors: ['#0ea5e9', '#ec4899'] },
            { title: 'Frontend Development', desc: 'Implementasi slicing dan integrasi API', date: '1-21 Feb 2026', progress: 75, status: 'active', colors: ['#6366f1', '#10b981', '#f59e0b'] },
            { title: 'Backend API', desc: 'Pengembangan REST API dan database', date: '1-28 Feb 2026', progress: 60, status: 'active', colors: ['#ef4444', '#0ea5e9'] },
            { title: 'Testing & QA', desc: 'Unit test, integration test, dan UAT', date: '1-7 Mar 2026', progress: 0, status: 'upcoming', colors: ['#8b5cf6'] },
            { title: 'Deployment', desc: 'Deploy ke production dan monitoring', date: '8-10 Mar 2026', progress: 0, status: 'upcoming', colors: ['#10b981', '#ef4444'] },
        ];
        const container = document.getElementById('timeline');
        milestones.forEach((m, i) => {
            const el = document.createElement('div'); el.className = `timeline-item ${m.status}`;
            el.innerHTML = `<div class="ti-header"><div class="ti-title">${m.title}</div><div><span class="badge ${m.status === 'done' ? 'badge-green' : m.status === 'active' ? 'badge-yellow' : 'badge-gray'}">${m.status === 'done' ? 'Selesai' : m.status === 'active' ? 'Berlangsung' : 'Mendatang'}</span></div></div>
            <div class="ti-desc">${m.desc}</div><div class="ti-date">📅 ${m.date}</div>
            ${m.progress > 0 ? `<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div class="ti-progress" style="flex:1"><div class="ti-fill" style="width:${m.progress}%;background:${m.status === 'done' ? '#10b981' : '#f59e0b'}"></div></div><span style="font-size:.75rem;font-weight:600">${m.progress}%</span></div>` : ''}
            <div class="ti-members">${m.colors.map(c => `<div class="ti-avatar" style="background:${c}">${String.fromCharCode(65 + Math.floor(Math.random() * 26))}</div>`).join('')}</div>`;
            el.onclick = () => showToast(`${m.title} — ${m.status === 'done' ? 'Selesai' : m.progress + '% selesai'}`);
            container.appendChild(el);
        });
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    </script>
</body>

</html>
