<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tim — Manajemen Proyek</title>
    <link rel="icon" href="../../images/sr_logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fffbeb;
            color: #1e293b;
            min-height: 100vh
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: #f59e0b;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .2s
        }

        .back-btn:hover {
            background: #d97706
        }

        .topbar {
            background: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 50
        }

        .topbar-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f59e0b
        }

        .topbar-brand span {
            color: #1e293b
        }

        .topbar-nav {
            display: flex;
            gap: 8px
        }

        .topbar-nav a {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            color: #64748b;
            background: #f8fafc;
            transition: all .2s
        }

        .topbar-nav a:hover,
        .topbar-nav a.active {
            background: #f59e0b;
            color: #fff
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px
        }

        .page-sub {
            color: #64748b;
            margin-bottom: 24px
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px
        }

        .member-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
            text-align: center;
            transition: all .2s;
            cursor: pointer;
            border: 2px solid transparent
        }

        .member-card:hover {
            border-color: #f59e0b;
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .1)
        }

        .member-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0 auto 12px
        }

        .member-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 2px
        }

        .member-role {
            font-size: .78rem;
            color: #f59e0b;
            font-weight: 600;
            margin-bottom: 8px
        }

        .member-email {
            font-size: .75rem;
            color: #94a3b8;
            margin-bottom: 12px
        }

        .member-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9
        }

        .m-stat .m-val {
            font-weight: 700;
            font-size: .9rem
        }

        .m-stat .m-label {
            font-size: .6rem;
            color: #94a3b8
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: .6rem;
            font-weight: 600
        }

        .badge-pm {
            background: #fef3c7;
            color: #92400e
        }

        .badge-dev {
            background: #dbeafe;
            color: #1e40af
        }

        .badge-design {
            background: #fce7f3;
            color: #9d174d
        }

        .badge-qa {
            background: #d1fae5;
            color: #065f46
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: .85rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all .3s;
            z-index: 200
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0)
        }

        .demo-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeOverlay .4s .2s ease forwards
        }

        .demo-popup {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 20px;
            padding: 36px 40px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            color: #fff;
            transform: scale(.85);
            opacity: 0;
            animation: popIn .5s .4s cubic-bezier(.34, 1.56, .64, 1) forwards;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .4)
        }

        .demo-popup .popup-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            display: block;
            animation: bounce 2s ease infinite
        }

        .demo-popup h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .demo-popup p {
            font-size: .88rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px
        }

        .demo-popup .popup-btn {
            padding: 10px 32px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: .88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, .4)
        }

        .demo-popup .popup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, .5)
        }

        @keyframes fadeOverlay {
            to {
                opacity: 1
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
                opacity: 1
            }
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-8px)
            }
        }

        @media(max-width:768px) {
            .topbar {
                flex-wrap: wrap;
                gap: 8px
            }

            .topbar-nav {
                flex-wrap: wrap
            }

            .team-grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <div class="demo-overlay" id="demoOverlay" onclick="closeDemoPopup()">
        <div class="demo-popup" onclick="event.stopPropagation()"><span class="popup-icon">📋</span>
            <h3>Halaman Demo</h3>
            <p>Ini adalah halaman <strong style="color:#e2e8f0">demo</strong> dari aplikasi yang pernah dibuat. Silakan
                klik-klik dan coba fitur yang tersedia!</p><button class="popup-btn"
                onclick="closeDemoPopup()">Mengerti, Lanjutkan →</button>
        </div>
    </div>
    <script>function closeDemoPopup() { const o = document.getElementById('demoOverlay'); o.style.opacity = '0'; setTimeout(() => o.remove(), 400); }</script>
    <a href="../../index.html#projects" class="back-btn">← Kembali</a>
    <header class="topbar">
        <div class="topbar-brand">📋 <span>Proyek</span>Manager</div>
        <nav class="topbar-nav"><a href="index.html">📋 Board</a><a href="timeline.html">📅 Timeline</a><a
                href="laporan.html">📊 Laporan</a><a href="tim.html" class="active">👥 Tim</a></nav>
    </header>
    <div class="container">
        <h1 class="page-title">Anggota Tim</h1>
        <p class="page-sub">Kelola anggota tim proyek Anda</p>
        <div class="team-grid" id="teamGrid"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const members = [
            { name: 'Ahmad Fauzi', role: 'Project Manager', email: 'ahmad@company.id', color: '#f59e0b', badge: 'badge-pm', online: true, tasks: 12, done: 8, projects: 3 },
            { name: 'Siti Nurhaliza', role: 'Frontend Developer', email: 'siti@company.id', color: '#3b82f6', badge: 'badge-dev', online: true, tasks: 18, done: 15, projects: 2 },
            { name: 'Budi Santoso', role: 'Backend Developer', email: 'budi@company.id', color: '#10b981', badge: 'badge-dev', online: false, tasks: 14, done: 10, projects: 2 },
            { name: 'Dewi Lestari', role: 'UI/UX Designer', email: 'dewi@company.id', color: '#ec4899', badge: 'badge-design', online: true, tasks: 9, done: 7, projects: 3 },
            { name: 'Rizky Ramadhan', role: 'Fullstack Developer', email: 'rizky@company.id', color: '#6366f1', badge: 'badge-dev', online: true, tasks: 22, done: 18, projects: 4 },
            { name: 'Putri Amelia', role: 'QA Engineer', email: 'putri@company.id', color: '#8b5cf6', badge: 'badge-qa', online: false, tasks: 15, done: 12, projects: 2 },
        ];
        document.getElementById('teamGrid').innerHTML = members.map(m => `
            <div class="member-card" onclick="showToast('Profil: ${m.name} — ${m.role}')">
                <div class="member-avatar" style="background:${m.color}">${m.name.split(' ').map(n => n[0]).join('')}</div>
                <div class="member-name"><span class="online-dot" style="background:${m.online ? '#10b981' : '#94a3b8'}"></span>${m.name}</div>
                <div class="member-role"><span class="badge ${m.badge}">${m.role}</span></div>
                <div class="member-email">${m.email}</div>
                <div class="member-stats">
                    <div class="m-stat"><div class="m-val">${m.tasks}</div><div class="m-label">Tasks</div></div>
                    <div class="m-stat"><div class="m-val" style="color:#10b981">${m.done}</div><div class="m-label">Selesai</div></div>
                    <div class="m-stat"><div class="m-val">${m.projects}</div><div class="m-label">Proyek</div></div>
                </div>
            </div>
        `).join('');
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    </script>
</body>

</html>
