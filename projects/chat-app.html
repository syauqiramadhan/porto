<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo — Aplikasi Chat Real-time</title>
    <link rel="icon" href="../images/sr_logo.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            overflow: hidden
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: #0ea5e9;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background .2s
        }

        .back-btn:hover {
            background: #0284c7
        }

        /* Contact list */
        .contacts {
            width: 300px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column
        }

        .contacts-header {
            padding: 16px 20px;
            border-bottom: 1px solid #334155
        }

        .contacts-header h2 {
            font-size: 1rem;
            margin-bottom: 10px
        }

        .contacts-search input {
            width: 100%;
            padding: 8px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: .85rem;
            outline: none
        }

        .contacts-search input:focus {
            border-color: #0ea5e9
        }

        .contact-list {
            flex: 1;
            overflow-y: auto
        }

        .contact {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: background .2s;
            border-left: 3px solid transparent
        }

        .contact:hover,
        .contact.active {
            background: #334155;
            border-left-color: #0ea5e9
        }

        .contact-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0
        }

        .contact-info {
            flex: 1;
            min-width: 0
        }

        .contact-name {
            font-size: .85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .contact-preview {
            font-size: .72rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .contact-meta {
            text-align: right;
            flex-shrink: 0
        }

        .contact-time {
            font-size: .65rem;
            color: #94a3b8
        }

        .unread-badge {
            background: #0ea5e9;
            color: #fff;
            font-size: .6rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-top: 4px;
            display: inline-block
        }

        /* Chat area */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a
        }

        .chat-header {
            padding: 14px 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .chat-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem
        }

        .chat-header-info .name {
            font-size: .9rem;
            font-weight: 600
        }

        .chat-header-info .status {
            font-size: .7rem;
            color: #10b981
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .msg {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: .85rem;
            line-height: 1.5;
            animation: fadeIn .3s ease
        }

        .msg.sent {
            background: #0ea5e9;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px
        }

        .msg.received {
            background: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px
        }

        .msg .time {
            font-size: .6rem;
            opacity: .6;
            margin-top: 4px;
            display: block
        }

        .typing-indicator {
            align-self: flex-start;
            background: #1e293b;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: .8rem;
            color: #94a3b8;
            display: none
        }

        .typing-indicator.show {
            display: block
        }

        .chat-input {
            padding: 16px 20px;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px
        }

        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: .85rem;
            outline: none
        }

        .chat-input input:focus {
            border-color: #0ea5e9
        }

        .chat-input button {
            padding: 10px 20px;
            background: #0ea5e9;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: .85rem;
            transition: background .2s
        }

        .chat-input button:hover {
            background: #0284c7
        }

        .emoji-btn {
            background: none !important;
            font-size: 1.2rem;
            padding: 10px !important;
            cursor: pointer
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media(max-width:768px) {
            .contacts {
                width: 80px
            }

            .contact-info,
            .contact-meta,
            .contacts-header h2,
            .contacts-search {
                display: none
            }

            .contact {
                padding: 10px;
                justify-content: center
            }
        }
    </style>
</head>

<body>
    <!-- Demo Banner -->
    <style>
        .demo-banner {
            position: fixed;

            .demo-overlay {
                position: fixed;
                inset: 0;
                z-index: 9999;
                background: rgba(0, 0, 0, .5);
                backdrop-filter: blur(6px);
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                animation: fadeOverlay .4s .2s ease forwards
            }

            .demo-popup {
                background: linear-gradient(135deg, #1e293b, #0f172a);
                border: 1px solid rgba(255, 255, 255, .1);
                border-radius: 20px;
                padding: 36px 40px;
                max-width: 440px;
                width: 90%;
                text-align: center;
                color: #fff;
                transform: scale(.85);
                opacity: 0;
                animation: popIn .5s .4s cubic-bezier(.34, 1.56, .64, 1) forwards;
                box-shadow: 0 25px 60px rgba(0, 0, 0, .4)
            }

            .demo-popup .popup-icon {
                font-size: 3rem;
                margin-bottom: 16px;
                display: block;
                animation: bounce 2s ease infinite
            }

            .demo-popup h3 {
                font-size: 1.15rem;
                font-weight: 700;
                margin-bottom: 8px;
                background: linear-gradient(135deg, #38bdf8, #0ea5e9);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent
            }

            .demo-popup p {
                font-size: .88rem;
                color: #94a3b8;
                line-height: 1.6;
                margin-bottom: 20px
            }

            .demo-popup .popup-btn {
                padding: 10px 32px;
                background: linear-gradient(135deg, #0ea5e9, #38bdf8);
                color: #fff;
                border: none;
                border-radius: 10px;
                font-size: .88rem;
                font-weight: 600;
                cursor: pointer;
                transition: all .2s;
                box-shadow: 0 4px 15px rgba(14, 165, 233, .4)
            }

            .demo-popup .popup-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(14, 165, 233, .5)
            }

            @keyframes fadeOverlay {
                to {
                    opacity: 1
                }
            }

            @keyframes popIn {
                to {
                    transform: scale(1);
                    opacity: 1
                }
            }

            @keyframes bounce {

                0%,
                100% {
                    transform: translateY(0)
                }

                50% {
                    transform: translateY(-8px)
                }
            }
    </style>
    <div class="demo-overlay" id="demoOverlay" onclick="closeDemoPopup()">
        <div class="demo-popup" onclick="event.stopPropagation()">
            <span class="popup-icon">💬</span>
            <h3>Halaman Demo</h3>
            <p>Ini adalah halaman <strong style="color:#e2e8f0">demo</strong> dari aplikasi yang pernah dibuat. Silakan
                klik-klik dan coba fitur yang tersedia!</p>
            <button class="popup-btn" onclick="closeDemoPopup()">Mengerti, Lanjutkan →</button>
        </div>
    </div>
    <script>function closeDemoPopup() { const o = document.getElementById('demoOverlay'); o.style.opacity = '0'; setTimeout(() => o.remove(), 400); }</script>

    <a href="../index.html#projects" class="back-btn">← Kembali</a>

    <aside class="contacts">
        <div class="contacts-header">
            <h2>💬 Chats</h2>
            <div class="contacts-search"><input type="text" placeholder="Cari chat..." /></div>
        </div>
        <div class="contact-list" id="contactList"></div>
    </aside>

    <main class="chat">
        <div class="chat-header">
            <div class="chat-header-avatar" id="chatAvatar" style="background:#334155">👤</div>
            <div class="chat-header-info">
                <div class="name" id="chatName">Pilih kontak</div>
                <div class="status" id="chatStatus">—</div>
            </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typingIndicator">sedang mengetik...</div>
        <div class="chat-input">
            <button class="emoji-btn" onclick="addEmoji()">😊</button>
            <input type="text" placeholder="Ketik pesan..." id="msgInput" />
            <button onclick="sendMessage()" id="sendBtn">Kirim</button>
        </div>
    </main>

    <script>
        const contacts = [
            {
                id: 1, name: 'Tim Dev 🔥', avatar: '👥', bg: '#1e40af', msgs: [
                    { text: 'Halo squad! Sprint review besok jam 10 ya', sent: false, time: '09:30' },
                    { text: 'Siap, jangan lupa push branch masing-masing', sent: true, time: '09:32' },
                    { text: 'Done! Sudah merge ke develop', sent: false, time: '09:45' },
                ], status: '5 anggota online', preview: 'Done! Sudah merge ke develop', unread: 3
            },
            {
                id: 2, name: 'Andi Prasetyo', avatar: '👨‍💻', bg: '#0f766e', msgs: [
                    { text: 'Bro, API endpoint yang login udah selesai belum?', sent: false, time: '10:00' },
                    { text: 'Sudah bro, tinggal integrasi sama frontend', sent: true, time: '10:05' },
                    { text: 'Mantap! Saya test dulu ya pakai Postman', sent: false, time: '10:07' },
                ], status: 'Online', preview: 'Mantap! Saya test...', unread: 1
            },
            {
                id: 3, name: 'Putri Designer', avatar: '👩‍🎨', bg: '#be185d', msgs: [
                    { text: 'Ini mockup halaman dashboard baru', sent: false, time: '11:20' },
                    { text: 'Keren banget Putri! Warnanya cocok', sent: true, time: '11:25' },
                ], status: 'Online', preview: 'Keren banget Putri!', unread: 0
            },
            {
                id: 4, name: 'Client — Pak Ahmad', avatar: '🏢', bg: '#b45309', msgs: [
                    { text: 'Selamat siang, progress proyeknya bagaimana?', sent: false, time: '14:00' },
                    { text: 'Siang Pak, sudah 80% selesai. Estimasi minggu depan bisa UAT.', sent: true, time: '14:10' },
                    { text: 'Baik, ditunggu ya progress-nya', sent: false, time: '14:12' },
                ], status: 'Last seen 14:12', preview: 'Baik, ditunggu ya...', unread: 2
            },
            {
                id: 5, name: 'Bot Notifikasi 🤖', avatar: '🤖', bg: '#4338ca', msgs: [
                    { text: '⚠️ Server CPU usage: 85%. Perlu pengecekan!', sent: false, time: '16:00' },
                    { text: '✅ Deployment v2.3.1 berhasil di production', sent: false, time: '16:30' },
                ], status: 'Bot', preview: '✅ Deployment v2.3.1...', unread: 2
            },
        ];

        let activeContact = null;

        // Render contacts
        function renderContacts() {
            document.getElementById('contactList').innerHTML = contacts.map(c => `
        <div class="contact ${activeContact && activeContact.id === c.id ? 'active' : ''}" onclick="selectContact(${c.id})">
          <div class="contact-avatar" style="background:${c.bg}">${c.avatar}</div>
          <div class="contact-info">
            <div class="contact-name">${c.name}</div>
            <div class="contact-preview">${c.preview}</div>
          </div>
          <div class="contact-meta">
            <div class="contact-time">${c.msgs[c.msgs.length - 1].time}</div>
            ${c.unread ? `<span class="unread-badge">${c.unread}</span>` : ''}
          </div>
        </div>
      `).join('');
        }
        renderContacts();

        function selectContact(id) {
            activeContact = contacts.find(c => c.id === id);
            activeContact.unread = 0;
            renderContacts();
            document.getElementById('chatName').textContent = activeContact.name;
            document.getElementById('chatStatus').textContent = activeContact.status;
            document.getElementById('chatAvatar').textContent = activeContact.avatar;
            document.getElementById('chatAvatar').style.background = activeContact.bg;
            renderMessages();
        }

        function renderMessages() {
            if (!activeContact) return;
            document.getElementById('messages').innerHTML = activeContact.msgs.map(m => `
        <div class="msg ${m.sent ? 'sent' : 'received'}">
          ${m.text}
          <span class="time">${m.time} ${m.sent ? '✓✓' : ''}</span>
        </div>
      `).join('');
            const box = document.getElementById('messages');
            box.scrollTop = box.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !activeContact) return;
            const now = new Date();
            const time = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            activeContact.msgs.push({ text, sent: true, time });
            activeContact.preview = text;
            input.value = '';
            renderMessages();
            renderContacts();

            // Simulate reply
            const typing = document.getElementById('typingIndicator');
            typing.classList.add('show');
            setTimeout(() => {
                typing.classList.remove('show');
                const replies = ['Oke siap! 👍', 'Noted, akan saya cek', 'Baik, terima kasih 🙏', 'Good idea! 💡', 'Mantap 🔥', 'Saya setuju dengan itu'];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                const rTime = new Date();
                activeContact.msgs.push({ text: reply, sent: false, time: rTime.getHours().toString().padStart(2, '0') + ':' + rTime.getMinutes().toString().padStart(2, '0') });
                activeContact.preview = reply;
                renderMessages();
                renderContacts();
            }, 1500 + Math.random() * 1000);
        }

        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        const emojis = ['😊', '👍', '🔥', '💡', '✅', '🎉', '🙏', '❤️', '😂', '🤔'];
        let emojiIdx = 0;
        function addEmoji() {
            const input = document.getElementById('msgInput');
            input.value += emojis[emojiIdx % emojis.length];
            emojiIdx++;
            input.focus();
        }

        // Auto-select first contact
        selectContact(1);
    </script>
</body>

</html>
