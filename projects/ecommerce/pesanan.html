<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Pesanan - Aurora</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Back to Portfolio -->
    <a href="../../index.html#projects" class="back-btn-global">
        <i data-feather="arrow-left"></i> Kembali ke Portfolio
    </a>

    <!-- TOPBAR -->
    <header class="aurora-topbar">
        <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i data-feather="menu"></i>
            </button>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a78bfa" />
                        <stop offset="100%" stop-color="#7635ED" />
                    </linearGradient>
                </defs>
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>AURORA</span>
        </div>
        <nav class="topbar-center">
            <a href="#">Beranda</a>
            <a href="#">Toko</a>
            <a href="#" class="active">Dasbor</a>
            <a href="#">Halaman <i data-feather="chevron-down" style="width:14px; margin-left:4px; vertical-align:middle;"></i></a>
        </nav>
        <div class="topbar-right">
            <span>Akun</span>
            <div class="avatar-circle">BD</div>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="aurora-layout">
        
        <!-- MOBILE OVERLAY -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- LEFT SIDEBAR -->
        <aside class="aurora-sidebar">
            <nav class="sidebar-nav">
                <a href="index.html"><i data-feather="grid"></i> Dasbor</a>
                <a href="produk.html"><i data-feather="package"></i> Produk</a>
                <a href="pesanan.html" class="active"><i data-feather="shopping-bag"></i> Pesanan</a>
                <a href="pelanggan.html"><i data-feather="users"></i> Pelanggan</a>
                <a href="#"><i data-feather="bar-chart-2"></i> Analitik</a>
                <a href="#"><i data-feather="target"></i> Pemasaran</a>
            </nav>
            <nav class="sidebar-nav bottom">
                <a href="#"><i data-feather="settings"></i> Pengaturan</a>
                <a href="#"><i data-feather="log-out"></i> Keluar</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="aurora-main-wrapper">
            
            <div class="content-header">
                <div>
                    <h2 style="font-size: 1.1rem; font-weight: 500;">Manajemen Penjualan</h2>
                    <h1>Daftar Pesanan</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-primary"><i data-feather="download"></i> Ekspor Data</button>
                </div>
            </div>

            <!-- DASHBOARD GRID (Full Width for Table) -->
            <div class="aurora-dashboard-grid" style="grid-template-columns: 1fr;">
                <div class="white-card">
                    <div class="card-header">
                        <h3>Semua Pesanan</h3>
                        <div style="display:flex; gap:12px; align-items:center;">
                            <div style="background:var(--bg-gray); padding:8px 12px; border-radius:8px; display:flex; align-items:center; gap:8px; border:1px solid var(--border-dark);">
                                <i data-feather="search" style="width:16px; color:var(--text-muted);"></i>
                                <input type="text" placeholder="Cari ID Pesanan..." style="border:none; background:none; outline:none; font-family:inherit;">
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table" id="orderTable">
                            <thead>
                                <tr>
                                    <th>ID Pesanan</th>
                                    <th>Tanggal</th>
                                    <th>Pelanggan</th>
                                    <th>Total Pembayaran</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rendered by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        feather.replace();

        // Data Pesanan
        const orders = [
            { id: 'ORD-2023-001', date: '25 Okt 2023 14:30', cust: 'Budi Santoso', total: 15999000, status: 'Selesai', color: 'success' },
            { id: 'ORD-2023-002', date: '25 Okt 2023 15:15', cust: 'Fajar Pratama', total: 350000, status: 'Dikemas', color: 'primary' },
            { id: 'ORD-2023-003', date: '26 Okt 2023 09:10', cust: 'Siti Aminah', total: 890000, status: 'Menunggu Pembayaran', color: 'warning' },
            { id: 'ORD-2023-004', date: '26 Okt 2023 11:20', cust: 'Dewi Lestari', total: 4500000, status: 'Dikirim', color: 'info' },
            { id: 'ORD-2023-005', date: '27 Okt 2023 08:05', cust: 'Rina Melati', total: 1200000, status: 'Dibatalkan', color: 'danger' },
            { id: 'ORD-2023-006', date: '27 Okt 2023 10:45', cust: 'Andi Wijaya', total: 7500000, status: 'Selesai', color: 'success' }
        ];

        const fmt = n => 'Rp ' + n.toLocaleString('id-ID');

        function renderOrders() {
            const tbody = document.querySelector('#orderTable tbody');
            tbody.innerHTML = '';
            
            orders.forEach(o => {
                let badgeStyle = '';
                if(o.color === 'success') badgeStyle = 'background:var(--aurora-success-light); color:var(--aurora-success);';
                else if(o.color === 'warning') badgeStyle = 'background:var(--aurora-warning-light); color:var(--aurora-warning);';
                else if(o.color === 'primary') badgeStyle = 'background:#e0e7ff; color:#4f46e5;';
                else if(o.color === 'info') badgeStyle = 'background:#cffafe; color:#0891b2;';
                else badgeStyle = 'background:#fee2e2; color:#ef4444;';

                tbody.innerHTML += `
                <tr>
                    <td data-label="ID Pesanan" style="font-weight:700; color:var(--aurora-primary);">${o.id}</td>
                    <td data-label="Tanggal" style="color:var(--text-muted); font-size:0.85rem;">${o.date}</td>
                    <td data-label="Pelanggan" style="font-weight:600;">${o.cust}</td>
                    <td data-label="Total Pembayaran" style="font-weight:700;">${fmt(o.total)}</td>
                    <td data-label="Status">
                        <span class="badge-success" style="${badgeStyle}">${o.status}</span>
                    </td>
                    <td data-label="Aksi">
                        <button class="btn-glass" style="background:var(--bg-gray); border-color:var(--border-dark); color:var(--text-main); padding:6px 12px; font-size:0.8rem;">Detail</button>
                    </td>
                </tr>`;
            });
            feather.replace();
        }
        
        renderOrders();

        // Mobile Sidebar Toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.querySelector('.aurora-sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }

        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
