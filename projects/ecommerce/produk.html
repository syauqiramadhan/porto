<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaris Produk - Aurora</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Back to Portfolio -->
    <a href="../../index.html#projects" class="back-btn-global">
        <i data-feather="arrow-left"></i> Kembali ke Portfolio
    </a>

    <!-- TOPBAR -->
    <header class="aurora-topbar">
        <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i data-feather="menu"></i>
            </button>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a78bfa" />
                        <stop offset="100%" stop-color="#7635ED" />
                    </linearGradient>
                </defs>
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>AURORA</span>
        </div>
        <nav class="topbar-center">
            <a href="#">Beranda</a>
            <a href="#">Toko</a>
            <a href="#" class="active">Dasbor</a>
            <a href="#">Halaman <i data-feather="chevron-down" style="width:14px; margin-left:4px; vertical-align:middle;"></i></a>
        </nav>
        <div class="topbar-right">
            <span>Akun</span>
            <div class="avatar-circle">BD</div>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="aurora-layout">
        
        <!-- MOBILE OVERLAY -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- LEFT SIDEBAR -->
        <aside class="aurora-sidebar">
            <nav class="sidebar-nav">
                <a href="index.html"><i data-feather="grid"></i> Dasbor</a>
                <a href="produk.html" class="active"><i data-feather="package"></i> Produk</a>
                <a href="pesanan.html"><i data-feather="shopping-bag"></i> Pesanan</a>
                <a href="pelanggan.html"><i data-feather="users"></i> Pelanggan</a>
                <a href="#"><i data-feather="bar-chart-2"></i> Analitik</a>
                <a href="#"><i data-feather="target"></i> Pemasaran</a>
            </nav>
            <nav class="sidebar-nav bottom">
                <a href="#"><i data-feather="settings"></i> Pengaturan</a>
                <a href="#"><i data-feather="log-out"></i> Keluar</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="aurora-main-wrapper">
            
            <div class="content-header">
                <div>
                    <h2 style="font-size: 1.1rem; font-weight: 500;">Manajemen Katalog</h2>
                    <h1>Inventaris Produk</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-primary"><i data-feather="plus"></i> Tambah Produk</button>
                </div>
            </div>

            <!-- DASHBOARD GRID (Full Width for Table) -->
            <div class="aurora-dashboard-grid" style="grid-template-columns: 1fr;">
                <div class="white-card">
                    <div class="card-header">
                        <h3>Daftar Produk</h3>
                        <div style="display:flex; gap:12px; align-items:center;">
                            <div style="background:var(--bg-gray); padding:8px 12px; border-radius:8px; display:flex; align-items:center; gap:8px; border:1px solid var(--border-dark);">
                                <i data-feather="search" style="width:16px; color:var(--text-muted);"></i>
                                <input type="text" placeholder="Cari nama produk..." style="border:none; background:none; outline:none; font-family:inherit;">
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table" id="productTable">
                            <thead>
                                <tr>
                                    <th>ID/SKU</th>
                                    <th>Info Produk</th>
                                    <th>Kategori</th>
                                    <th>Harga</th>
                                    <th>Stok</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rendered by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        feather.replace();

        // Data Produk
        const products = [
            { sku: 'SKU-E01', name: 'Laptop Gaming Pro', icon: '💻', cat: 'Elektronik', price: 12999000, stock: 15, status: 'Tersedia', color: 'success' },
            { sku: 'SKU-E02', name: 'Smartphone 5G', icon: '📱', cat: 'Elektronik', price: 5999000, stock: 45, status: 'Tersedia', color: 'success' },
            { sku: 'SKU-F01', name: 'Kemeja Slim Fit', icon: '👔', cat: 'Fashion', price: 199000, stock: 0, status: 'Habis', color: 'danger' },
            { sku: 'SKU-F02', name: 'Sneakers Casual', icon: '👟', cat: 'Fashion', price: 599000, stock: 8, status: 'Menipis', color: 'warning' },
            { sku: 'SKU-A01', name: 'Smartwatch Fitness', icon: '⌚', cat: 'Aksesoris', price: 1599000, stock: 24, status: 'Tersedia', color: 'success' },
            { sku: 'SKU-P01', name: 'Mechanical Keyboard', icon: '⌨️', cat: 'Peralatan', price: 999000, stock: 3, status: 'Menipis', color: 'warning' },
            { sku: 'SKU-P02', name: 'Monitor 27" 4K', icon: '🖥️', cat: 'Peralatan', price: 4299000, stock: 12, status: 'Tersedia', color: 'success' }
        ];

        const fmt = n => 'Rp ' + n.toLocaleString('id-ID');

        function renderInventory() {
            const tbody = document.querySelector('#productTable tbody');
            tbody.innerHTML = '';
            
            products.forEach(p => {
                let badgeStyle = '';
                if(p.color === 'success') badgeStyle = 'background:var(--aurora-success-light); color:var(--aurora-success);';
                else if(p.color === 'warning') badgeStyle = 'background:var(--aurora-warning-light); color:var(--aurora-warning);';
                else badgeStyle = 'background:#fee2e2; color:#ef4444;';

                tbody.innerHTML += `
                <tr>
                    <td data-label="ID/SKU" style="font-weight:600; color:var(--text-muted);">${p.sku}</td>
                    <td data-label="Info Produk">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="font-size:1.5rem; background:var(--bg-gray); width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--border-dark);">${p.icon}</div>
                            <span style="font-weight:600;">${p.name}</span>
                        </div>
                    </td>
                    <td data-label="Kategori">${p.cat}</td>
                    <td data-label="Harga" style="font-weight:700;">${fmt(p.price)}</td>
                    <td data-label="Stok" style="font-weight:600;">${p.stock}</td>
                    <td data-label="Status">
                        <span class="badge-success" style="${badgeStyle}">${p.status}</span>
                    </td>
                    <td data-label="Aksi">
                        <div style="display:flex; gap:8px;">
                            <button style="border:none; background:none; cursor:pointer; color:var(--text-main);"><i data-feather="edit-2" style="width:16px;"></i></button>
                            <button style="border:none; background:none; cursor:pointer; color:#ef4444;"><i data-feather="trash-2" style="width:16px;"></i></button>
                        </div>
                    </td>
                </tr>`;
            });
            feather.replace();
        }
        
        renderInventory();

        // Mobile Sidebar Toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.querySelector('.aurora-sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }

        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
