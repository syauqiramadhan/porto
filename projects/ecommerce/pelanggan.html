<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pelanggan - Aurora</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Back to Portfolio -->
    <a href="../../index.html#projects" class="back-btn-global">
        <i data-feather="arrow-left"></i> Kembali ke Portfolio
    </a>

    <!-- TOPBAR -->
    <header class="aurora-topbar">
        <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i data-feather="menu"></i>
            </button>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a78bfa" />
                        <stop offset="100%" stop-color="#7635ED" />
                    </linearGradient>
                </defs>
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>AURORA</span>
        </div>
        <nav class="topbar-center">
            <a href="#">Beranda</a>
            <a href="#">Toko</a>
            <a href="#" class="active">Dasbor</a>
            <a href="#">Halaman <i data-feather="chevron-down" style="width:14px; margin-left:4px; vertical-align:middle;"></i></a>
        </nav>
        <div class="topbar-right">
            <span>Akun</span>
            <div class="avatar-circle">BD</div>
        </div>
    </header>

    <!-- MAIN APP LAYOUT -->
    <div class="aurora-layout">
        
        <!-- MOBILE OVERLAY -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- LEFT SIDEBAR -->
        <aside class="aurora-sidebar">
            <nav class="sidebar-nav">
                <a href="index.html"><i data-feather="grid"></i> Dasbor</a>
                <a href="produk.html"><i data-feather="package"></i> Produk</a>
                <a href="pesanan.html"><i data-feather="shopping-bag"></i> Pesanan</a>
                <a href="pelanggan.html" class="active"><i data-feather="users"></i> Pelanggan</a>
                <a href="#"><i data-feather="bar-chart-2"></i> Analitik</a>
                <a href="#"><i data-feather="target"></i> Pemasaran</a>
            </nav>
            <nav class="sidebar-nav bottom">
                <a href="#"><i data-feather="settings"></i> Pengaturan</a>
                <a href="#"><i data-feather="log-out"></i> Keluar</a>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="aurora-main-wrapper">
            
            <div class="content-header">
                <div>
                    <h2 style="font-size: 1.1rem; font-weight: 500;">Manajemen Pengguna</h2>
                    <h1>Data Pelanggan</h1>
                </div>
                <div class="header-actions">
                    <button class="btn-primary"><i data-feather="plus"></i> Tambah Pelanggan</button>
                </div>
            </div>

            <!-- DASHBOARD GRID (Full Width for Table) -->
            <div class="aurora-dashboard-grid" style="grid-template-columns: 1fr;">
                <div class="white-card">
                    <div class="card-header">
                        <h3>Daftar Pelanggan</h3>
                        <div style="display:flex; gap:12px; align-items:center;">
                            <div style="background:var(--bg-gray); padding:8px 12px; border-radius:8px; display:flex; align-items:center; gap:8px; border:1px solid var(--border-dark);">
                                <i data-feather="search" style="width:16px; color:var(--text-muted);"></i>
                                <input type="text" placeholder="Cari nama atau email..." style="border:none; background:none; outline:none; font-family:inherit;">
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table" id="customerTable">
                            <thead>
                                <tr>
                                    <th>Pelanggan</th>
                                    <th>Email / Kontak</th>
                                    <th>Bergabung</th>
                                    <th>Total Belanja</th>
                                    <th>Status</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rendered by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        feather.replace();

        // Data Pelanggan
        const customers = [
            { id: 1, name: 'Budi Santoso', email: 'budi.santoso@email.com', phone: '0812-3456-7890', joined: '12 Jan 2023', spent: 45000000, status: 'Aktif', color: 'success' },
            { id: 2, name: 'Fajar Pratama', email: 'fajar.p@email.com', phone: '0821-9876-5432', joined: '15 Mar 2023', spent: 12500000, status: 'Aktif', color: 'success' },
            { id: 3, name: 'Siti Aminah', email: 'siti.aminah@email.com', phone: '0852-1122-3344', joined: '02 Apr 2023', spent: 8900000, status: 'Aktif', color: 'success' },
            { id: 4, name: 'Dewi Lestari', email: 'dewilestari@email.com', phone: '0813-4455-6677', joined: '20 Mei 2023', spent: 3400000, status: 'Tidak Aktif', color: 'danger' },
            { id: 5, name: 'Rina Melati', email: 'rina.melati@email.com', phone: '0896-7788-9900', joined: '10 Jun 2023', spent: 0, status: 'Baru', color: 'primary' },
            { id: 6, name: 'Andi Wijaya', email: 'awijaya@email.com', phone: '0811-2233-4455', joined: '05 Agu 2023', spent: 21000000, status: 'Aktif', color: 'success' }
        ];

        const fmt = n => 'Rp ' + n.toLocaleString('id-ID');

        function renderCustomers() {
            const tbody = document.querySelector('#customerTable tbody');
            tbody.innerHTML = '';
            
            customers.forEach(c => {
                let badgeStyle = '';
                if(c.color === 'success') badgeStyle = 'background:var(--aurora-success-light); color:var(--aurora-success);';
                else if(c.color === 'primary') badgeStyle = 'background:#e0e7ff; color:#4f46e5;';
                else badgeStyle = 'background:#fee2e2; color:#ef4444;';

                tbody.innerHTML += `
                <tr>
                    <td data-label="Pelanggan">
                        <div class="customer-cell">
                            <div style="width:36px; height:36px; border-radius:50%; background:var(--aurora-primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem;">
                                ${c.name.charAt(0)}
                            </div>
                            <span style="font-weight:700;">${c.name}</span>
                        </div>
                    </td>
                    <td data-label="Email / Kontak">
                        <div style="display:flex; flex-direction:column; gap:4px;">
                            <span style="font-weight:500; font-size:0.9rem;">${c.email}</span>
                            <span style="color:var(--text-muted); font-size:0.8rem;">${c.phone}</span>
                        </div>
                    </td>
                    <td data-label="Bergabung" style="color:var(--text-muted); font-size:0.85rem;">${c.joined}</td>
                    <td data-label="Total Belanja" style="font-weight:700; color:var(--aurora-primary);">${fmt(c.spent)}</td>
                    <td data-label="Status">
                        <span class="badge-success" style="${badgeStyle}">${c.status}</span>
                    </td>
                    <td data-label="Aksi">
                        <div style="display:flex; gap:8px; justify-content:flex-end;">
                            <button style="border:none; background:none; cursor:pointer; color:var(--text-main);"><i data-feather="mail" style="width:16px;"></i></button>
                            <button style="border:none; background:none; cursor:pointer; color:var(--text-main);"><i data-feather="edit-2" style="width:16px;"></i></button>
                        </div>
                    </td>
                </tr>`;
            });
            feather.replace();
        }
        
        renderCustomers();

        // Mobile Sidebar Toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.querySelector('.aurora-sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }

        mobileMenuBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
